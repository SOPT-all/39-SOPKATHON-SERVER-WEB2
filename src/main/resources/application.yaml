server:
  # nginx가 넘겨주는 X-Forwarded-* 헤더를 반영해 원래 요청(https, 도메인)을 기준으로 처리
  # (없으면 같은 도메인 요청도 http로 인식되어 CORS로 거부됨)
  forward-headers-strategy: framework

spring:
  application:
    name: sopkathon
  profiles:
    default: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      # nginx client_max_body_size(10M)보다 작게 두어 Spring에서 JSON 에러(413)로 응답
      max-file-size: 5MB
      max-request-size: 8MB

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET}
    # 비워두면 기본 자격 증명 체인(EC2 IAM Role, 환경 변수 등)을 사용
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
