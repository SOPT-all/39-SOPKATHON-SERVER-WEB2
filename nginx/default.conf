upstream app {
    server app:8080;
}

server {
    listen 80;
    server_name sopkerthon.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sopkerthon.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/sopkerthon.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sopkerthon.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;
    # 크기 초과로 nginx에서 먼저 거부될 때도 공통 에러 응답(JSON) 형식으로 반환
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"code":"GLB-E008","message":"요청 크기가 허용 범위를 초과했습니다."}';
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
